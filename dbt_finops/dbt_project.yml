# dbt project configuration

name: 'dbt_finops'
version: '1.0.0'

# Must match a profile defined in profiles.yml
profile: 'dbt_finops'

vars:
  cost_flag_percentile: 0.95
  cost_flag_min_usd: 0.002

# Directory layout
model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

# Directories removed by `dbt clean`
clean-targets:
  - "target"
  - "dbt_packages"

models:
  dbt_finops:
    staging:
      +materialized: view
    marts:
      +materialized: table